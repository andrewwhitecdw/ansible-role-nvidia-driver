---
- name: verify package name is not version-pinned when state is absent
  hosts: localhost
  gather_facts: false
  vars:
    nvidia_driver_ubuntu_cuda_package: nvidia-driver-470
    nvidia_driver_package_version: "470.103.01-1"
    nvidia_driver_package_state: absent
  tasks:
    - name: compute expected package name
      set_fact:
        nvidia_driver_package_name: "{{ (nvidia_driver_package_version and nvidia_driver_package_state != 'absent') | ternary(nvidia_driver_ubuntu_cuda_package+'='+nvidia_driver_package_version, nvidia_driver_ubuntu_cuda_package) }}"

    - name: assert version is not pinned on removal
      assert:
        that:
          - nvidia_driver_package_name == nvidia_driver_ubuntu_cuda_package
        fail_msg: "Package name must not include version when state is absent"
